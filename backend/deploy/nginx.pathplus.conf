# Nginx reverse proxy for Path+ API + Admin Dashboard
# Copy to /etc/nginx/sites-available/pathplus and enable.

upstream pathplus_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream pathplus_admin {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://pathplus_api;
    }
}

server {
    listen 80;
    server_name admin.yourdomain.com;

    client_max_body_size 25m;

    # Basic hardening
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://pathplus_admin;
    }
}
