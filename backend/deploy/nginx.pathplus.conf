# Path+ — Nginx reverse proxy
# Domains:
#   api.pathplus.store   → 127.0.0.1:3000  (Hono API)
#   admin.pathplus.store → 127.0.0.1:3001  (Admin dashboard)
#
# Install with: bash deploy/nginx-setup.sh

upstream pathplus_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream pathplus_admin {
    server 127.0.0.1:3001;
    keepalive 16;
}

# ── API ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.pathplus.store;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://pathplus_api;
    }
}

# ── Admin dashboard ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.pathplus.store;

    client_max_body_size 25m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://pathplus_admin;
    }
}
