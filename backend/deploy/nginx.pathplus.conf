# Path+ — Nginx reverse proxy (HTTP + HTTPS)
#   site.pathplus.store                → 127.0.0.1:3000  (Marketing + legal)
#   pathplus.store / www.pathplus.store → redirect to site.pathplus.store
#   api.pathplus.store                 → 127.0.0.1:3000  (Hono API)
#   admin.pathplus.store               → 127.0.0.1:3001  (Admin dashboard)
#
# Install: sudo bash deploy/nginx-setup.sh
# Certs:   /etc/letsencrypt/live/api.pathplus.store/

upstream pathplus_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream pathplus_admin {
    server 127.0.0.1:3001;
    keepalive 16;
}

# ── Marketing HTTP → HTTPS (site + legacy www/apex) ──
server {
    listen 80;
    listen [::]:80;
    server_name site.pathplus.store www.pathplus.store pathplus.store;
    return 301 https://site.pathplus.store$request_uri;
}

# ── Marketing HTTPS (canonical: site.pathplus.store) ─
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name site.pathplus.store www.pathplus.store pathplus.store;

    ssl_certificate     /etc/letsencrypt/live/api.pathplus.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pathplus.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Prefer site subdomain
    if ($host != site.pathplus.store) {
        return 301 https://site.pathplus.store$request_uri;
    }

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://pathplus_api;
    }
}

# ── API HTTP → HTTPS ─────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.pathplus.store;
    return 301 https://$host$request_uri;
}

# ── API HTTPS ────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pathplus.store;

    ssl_certificate     /etc/letsencrypt/live/api.pathplus.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pathplus.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://pathplus_api;
    }
}

# ── Admin HTTP → HTTPS ───────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.pathplus.store;
    return 301 https://$host$request_uri;
}

# ── Admin HTTPS ──────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.pathplus.store;

    ssl_certificate     /etc/letsencrypt/live/api.pathplus.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pathplus.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://pathplus_admin;
    }
}
